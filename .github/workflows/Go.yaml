name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.support }}, ${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - support: minimum
            os: ubuntu-latest
            go: "1.26.x"
          - support: minimum
            os: windows-latest
            go: "1.26.x"
          - support: minimum
            os: macos-latest
            go: "1.26.x"
          - support: current-stable
            os: ubuntu-latest
            go: "1.27.x"
          - support: current-stable
            os: windows-latest
            go: "1.27.x"
          - support: current-stable
            os: macos-latest
            go: "1.27.x"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Test
        run: go test -v ./...

  race:
    name: Race (current-stable, Linux, Go 1.27)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: Test with race detector
        run: go test -race ./...

  coverage:
    name: Coverage (minimum, Linux, Go 1.26)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Generate coverage profile
        run: |
          go test -v -cover ./... -coverprofile coverage.out -coverpkg ./...
          go tool cover -func=coverage.out -o=coverage-summary.out

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage-summary.out
          if-no-files-found: error
          retention-days: 1

  coverage-badge:
    name: Update coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, race, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download coverage summary
        uses: actions/download-artifact@v8
        with:
          name: coverage-summary

      - name: Update coverage badge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          summary = Path("coverage-summary.out").read_text()
          match = re.search(
              r"^total:\s+\(statements\)\s+([0-9]+(?:\.[0-9]+)?)%$",
              summary,
              re.MULTILINE,
          )
          if match is None:
              raise SystemExit("coverage-summary.out has no total statement coverage")

          value = match.group(1)
          percentage = float(value)
          color = "brightgreen" if percentage >= 80 else "yellow" if percentage >= 30 else "red"
          badge = f"![Coverage](https://img.shields.io/badge/Coverage-{value}%25-{color})"

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          updated, replacements = re.subn(
              r"!\[Coverage\]\(https://img\.shields\.io/badge/Coverage-[^)]+\)",
              badge,
              readme,
          )
          if replacements != 1:
              raise SystemExit(f"expected one coverage badge, found {replacements}")
          readme_path.write_text(updated)
          PY

      - name: Commit and push badge if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Coverage badge is current."
            exit 0
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "chore: update coverage badge"
          git push origin HEAD:master
